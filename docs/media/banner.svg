<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">ZEHEN</title>
  <desc id="d">ZEHEN: control your PC with your hands and your voice. Free and open source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04090d"/><stop offset="1" stop-color="#071a22"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#3dff9a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/><stop offset=".5" stop-color="#00e5ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00e5ff" stroke-opacity=".07"/>
    </pattern>
    <radialGradient id="fade" cx=".72" cy=".5" r=".75">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="m"><rect width="1280" height="420" fill="url(#fade)"/></mask>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1280" height="420" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)" mask="url(#m)"/>
    <rect width="1280" height="90" y="-90" fill="url(#beam)">
      <animate attributeName="y" values="-90;420" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- reticle -->
    <g transform="translate(985 210)">
      <g fill="none" stroke="#007a8a" stroke-width="2">
        <circle r="168" stroke-dasharray="2 11"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></circle>
        <circle r="128" stroke-opacity=".5"/>
      </g>
      <g fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
        <g><path d="M0 -150 A150 150 0 0 1 130 -75"/><path d="M130 75 A150 150 0 0 1 0 150"/><path d="M-130 75 A150 150 0 0 1 -130 -75"/>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/></g>
      </g>
      <g filter="url(#glow)">
        <circle r="62" fill="none" stroke="#00e5ff" stroke-width="4">
          <animate attributeName="r" values="62;54;62" dur="2.6s" repeatCount="indefinite"/></circle>
        <circle r="8" fill="#00e5ff"/>
      </g>
      <g stroke="#00e5ff" stroke-opacity=".35"><path d="M0 -210V-90M0 90V210M-210 0H-90M90 0H210"/></g>
      <text x="108" y="-100" fill="#00e5ff" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="3">PINCH  =  CLICK</text>
      <text x="-190" y="150" fill="#3dff9a" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="3">SAY  "ZEHEN"</text>
    </g>

    <!-- wordmark -->
    <text x="72" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="132" letter-spacing="14" fill="url(#ink)" filter="url(#glow)">ZEHEN</text>
    <text x="78" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="31" fill="#cfeff4">Your hands move the cursor. Your voice runs the PC.</text>
    <text x="78" y="288" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="2" fill="#6f9aa3">WEBCAM  +  MICROPHONE   //   NO EXTRA HARDWARE   //   FREE  &amp;  OPEN SOURCE</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="2">
      <rect x="78" y="326" width="156" height="38" rx="19" fill="none" stroke="#00e5ff"/>
      <circle cx="102" cy="345" r="5" fill="#3dff9a"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="118" y="351" fill="#00e5ff">TRACKING</text>
      <rect x="248" y="326" width="132" height="38" rx="19" fill="none" stroke="#00e5ff"/>
      <circle cx="272" cy="345" r="5" fill="#00e5ff"><animate attributeName="opacity" values="1;.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="288" y="351" fill="#00e5ff">VOICE</text>
      <rect x="394" y="326" width="168" height="38" rx="19" fill="none" stroke="#007a8a"/>
      <text x="418" y="351" fill="#6f9aa3">MIT LICENSE</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1279" height="419" rx="22" fill="none" stroke="#00e5ff" stroke-opacity=".35"/>
</svg>
